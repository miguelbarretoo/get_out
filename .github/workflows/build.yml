name: Build ColorOS 17 Port

on:
  workflow_dispatch:
    inputs:
      OTA_LINK:
        description: "Put OnePlus OTA link here"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c2s, x1s, y2s, z3s, r8s]

    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: At30c/ColorOS17-Exynos990
          token: ${{ secrets.GH_AUTH }}
          submodules: 'recursive'

      # First on purpose: the OTA link expires in 10 minutes
      - name: Download OnePlus OTA
        env:
          OTA_LINK: ${{ github.event.inputs.OTA_LINK }}
        run: ./build.sh --download-ota "$OTA_LINK"

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: Free disk space (2/3)
        # TODO: pin to a commit SHA instead of @main
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        # TODO: pin to a commit SHA instead of @main
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            attr ccache clang ffmpeg liblzma-dev libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget gh pkg-config \
            7zip brotli erofs-utils f2fs-tools lz4 \
            android-sdk-libsparse-utils e2fsprogs file jq \
            curl ca-certificates \
            libssl-dev bc bison flex cpio perl binutils libelf-dev

          sudo modprobe erofs f2fs

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cache cargo binaries
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-otadump-${{ runner.os }}

      - name: Install Rust and otadump
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install --locked otadump

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add swap space
        run: |
          SWAP_FILE=$(swapon --show=NAME --noheadings | tail -n 1)

          if [ -n "$SWAP_FILE" ]; then
            echo "Existing swap found: $SWAP_FILE"
            sudo swapoff "$SWAP_FILE"
            sudo rm -f "$SWAP_FILE"
          else
            SWAP_FILE="/swapfile"
            echo "No existing swap found. Creating $SWAP_FILE"
          fi

          sudo fallocate -l 12G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"

          free -h
          swapon --show

      - name: Set up GH login
        env:
          GH_AUTH: ${{ secrets.GH_AUTH }}
        run: |
          echo "$GH_AUTH" | gh auth login --with-token
          gh auth setup-git
          gh auth status

      - name: Download large files
        run: bash scripts/fetch_large_files.sh

      - name: Build ROM
        run: ./build.sh ${{ matrix.target }} erofs -z -k

      - name: Upload zips to Gofile
        env:
          TARGET_DIR: out/target/${{ matrix.target }}
        run: |
          shopt -s nullglob
          files=("$TARGET_DIR"/*.zip)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: no .zip files found in '$TARGET_DIR'!"
            exit 1
          fi

          echo "### Gofile links for \`${{ matrix.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          failed=0

          for file in "${files[@]}"; do
            echo "--- Uploading: $file ---"
            response=$(curl -s --retry 3 --retry-delay 5 -F "file=@$file" https://upload.gofile.io/uploadfile)
            link=$(echo "$response" | jq -r '.data.downloadPage // empty')

            if [[ "$link" == https://gofile.io/d/* ]]; then
              echo "✅ $(basename "$file"): $link"
              echo "- \`$(basename "$file")\`: $link" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Failed to upload $file. Server response:"
              echo "$response"
              failed=1
            fi
          done

          exit $failed
