name: Build ColorOS 17 Port

on:
  workflow_dispatch:
    inputs:
      OTA_LINK:
        description: "Put OnePlus OTA link here"
        required: true
      DEBUG:
        description: "Debug build (adds -d flag)"
        type: boolean
        default: false  
      TARGET:
        description: Device to build
        type: choice
        options: [all, r8s, x1s, y2s, z3s, c2s]
        default: all
      SOURCE_REF:
        description: Full source commit SHA (required for r8s releases)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.TARGET == 'all' && '["c2s","x1s","y2s","z3s","r8s"]' || format('["{0}"]', inputs.TARGET)) }}

    steps:
      - name: Check requested source revision
        if: matrix.target == 'r8s' || inputs.SOURCE_REF != ''
        env:
          SOURCE_REF: ${{ inputs.SOURCE_REF }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ROM_SOURCE_REPOSITORY }}
          ref: ${{ inputs.SOURCE_REF }}
          token: ${{ secrets.GH_AUTH }}
          submodules: 'recursive'

      # First on purpose: the OTA link expires in 10 minutes
      - name: Download OnePlus OTA
        env:
          OTA_LINK: ${{ github.event.inputs.OTA_LINK }}
        run: ./build.sh --download-ota "$OTA_LINK"

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: Free disk space (2/3)
        # TODO: pin to a commit SHA instead of @main
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        # TODO: pin to a commit SHA instead of @main
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            attr ccache clang ffmpeg liblzma-dev libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget gh pkg-config \
            7zip brotli erofs-utils f2fs-tools lz4 \
            android-sdk-libsparse-utils e2fsprogs file jq \
            curl ca-certificates \
            libssl-dev bc bison flex cpio perl binutils libelf-dev

          if [[ "$BUILD_TARGET" == r8s ]]; then
            sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
              libc++1 libc++abi1 rsync unzip xz-utils zip
            has_filesystem() { awk -v fs="$1" '$NF == fs { found=1 } END { exit !found }' /proc/filesystems; }
            for fs in erofs f2fs; do
              if ! has_filesystem "$fs" && ! sudo modprobe "$fs"; then
                for package in "linux-modules-$(uname -r)" "linux-modules-extra-$(uname -r)"; do
                  if apt-cache show "$package" >/dev/null 2>&1; then
                    sudo DEBIAN_FRONTEND=noninteractive apt install -yq "$package"
                    if sudo modprobe "$fs"; then break; fi
                  fi
                done
              fi
              has_filesystem "$fs" || { echo "Required filesystem unavailable: $fs" >&2; exit 1; }
            done
          else
            sudo modprobe erofs f2fs
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add r8s kernel build swap
        if: matrix.target == 'r8s'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8

      - name: Cache cargo binaries
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-otadump-${{ runner.os }}

      - name: Install Rust and otadump
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install --locked otadump

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up GH login
        env:
          GH_AUTH: ${{ secrets.GH_AUTH }}
        run: |
          echo "$GH_AUTH" | gh auth login --with-token
          gh auth setup-git
          gh auth status

      - name: Download large files
        run: bash scripts/fetch_large_files.sh

      - name: Cache the r8s kernel binaries
        if: matrix.target == 'r8s'
        uses: actions/cache@v4
        with:
          path: ${{ secrets.ROM_KERNEL_DIRECTORY }}
          key: kernel-r8s-${{ runner.os }}-${{ secrets.ROM_KERNEL_CACHE_KEY }}

      - name: Build ROM
        env:
          DEBUG: ${{ github.event.inputs.DEBUG }}
        run: |
          flags=(-z -k)
          if [ "$DEBUG" = "true" ]; then
            flags+=(-d)
          fi

          echo "Running: ./build.sh ${{ matrix.target }} erofs ${flags[*]}"
          ./build.sh "${{ matrix.target }}" erofs "${flags[@]}"

      - name: Prepare r8s release artifacts
        if: matrix.target == 'r8s'
        env:
          ROM_DIRECTORY: ${{ secrets.ROM_OUTPUT_DIRECTORY }}
          KERNEL_DIRECTORY: ${{ secrets.ROM_KERNEL_DIRECTORY }}
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/export-artifacts.py" \
            --output "$RUNNER_TEMP/export-artifacts.py"
          python3 "$RUNNER_TEMP/export-artifacts.py" \
            --rom-dir "$ROM_DIRECTORY" --kernel-dir "$KERNEL_DIRECTORY" \
            --output "$RUNNER_TEMP/rom-release"

      - name: Upload r8s kernel and checksums
        if: matrix.target == 'r8s'
        uses: actions/upload-artifact@v4
        with:
          name: GmKernel-r8s
          path: |
            ${{ runner.temp }}/rom-release/GmKernel-r8s.zip
            ${{ runner.temp }}/rom-release/SHA256SUMS
            ${{ runner.temp }}/rom-release/release-notes.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload zips to Gofile
        env:
          TARGET_DIR: out/target/${{ matrix.target }}
        run: |
          shopt -s nullglob
          files=("$TARGET_DIR"/*.zip)
          if [[ '${{ matrix.target }}' == r8s ]]; then
            files=("$RUNNER_TEMP/rom-release/"*)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: no release files found!"
            exit 1
          fi

          echo "### Gofile links for \`${{ matrix.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          failed=0

          for file in "${files[@]}"; do
            echo "--- Uploading: $file ---"
            response=$(curl -s --retry 3 --retry-delay 5 -F "file=@$file" https://upload.gofile.io/uploadfile)
            link=$(echo "$response" | jq -r '.data.downloadPage // empty')

            if [[ "$link" == https://gofile.io/d/* ]]; then
              echo "✅ $(basename "$file"): $link"
              echo "- \`$(basename "$file")\`: $link" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Failed to upload $file. Server response:"
              echo "$response"
              failed=1
            fi
          done

          exit $failed
